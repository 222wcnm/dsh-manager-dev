        <span class="brand-name">DSH Manager</span>
        <span class="brand-tag">dsh web</span>
      </div>

      </button>
    </header>

    <!-- ② 状态卡（焦点区：状态词 + 端口 / 次级信息行） -->
    <div id="statuscard" class="statuscard">
      <div class="sc-row1">
        <span class="state-word">
          <span id="dot" class="dot dot-stopped" aria-hidden="true"></span>
          <span id="state-word">—</span>
        </span>
        <span id="port-text" class="sc-port"></span>
      </div>
      <div id="row2-text" class="sc-row2">正在获取状态…</div>
    </div>

    <!-- ②.5 会话区（M9：状态卡下、操作区上，可折叠、默认展开；只读摘要元数据，不读内容） -->
    <section id="sessions-section" class="sessions hidden" aria-label="会话">
      <button id="sessions-toggle" class="sessions-head" type="button" aria-expanded="true" aria-controls="sessions-body">
        <span class="sessions-title">会话</span>
        <span id="sessions-count" class="sessions-count"></span>
        <svg class="sessions-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="sessions-body" class="sessions-body">
        <div id="sessions-list" class="sessions-list hidden"></div>
        <div id="sessions-empty" class="sessions-empty hidden"></div>
        <div id="sessions-hint" class="sessions-hint hidden"></div>
      </div>
    </section>

    <!-- ③ 操作区 -->
    <div class="ops">
      <div class="oprow">
        <button id="btn-start" class="btn primary" disabled><span class="spinner" aria-hidden="true"></span><span class="btn-label">启动</span></button>
        <button id="btn-stop" class="btn danger" disabled><span class="spinner" aria-hidden="true"></span><span class="btn-label">停止</span></button>
        <button id="btn-restart" class="btn outline" disabled><span class="spinner" aria-hidden="true"></span><span class="btn-label">重启</span></button>
      </div>
      <!-- 接管：仅 external 状态显示（hidden 控制不变），独占一行 -->
      <button id="btn-adopt" class="btn primary hidden" disabled><span class="spinner" aria-hidden="true"></span><span class="btn-label">接管</span></button>
      <!-- 打开 Web UI：全宽 ghost（flex:1 占满） -->
      <button id="btn-open" class="btn ghost" disabled>打开 Web UI</button>
    </div>

    <!-- 操作进度（点击后乐观反馈：不定进度条 + 阶段说明 + 耗时） -->
    <div id="progress" class="progress hidden" aria-live="polite">
      <div class="progress-bar"><div class="progress-bar-fill"></div></div>
      <div id="progress-text" class="progress-text"></div>
    </div>

    <!-- 错误面板 -->
    <div id="error-panel" class="error hidden">
      <div id="error-text" class="error-text"></div>
      <button id="btn-copy-log" class="btn outline small hidden">复制日志</button>
    </div>

    <!-- 操作结果 toast（点击反馈：完成/失败即时确认） -->
    <div id="toast" class="toast toast-hidden" role="status" aria-live="polite">
      <span id="toast-text"></span>
    </div>

    <!-- ④ 底栏：提示 + 日志入口 -->
    <footer class="foot">
      <!-- 初始中性文案：JS 首查 status 后按 detail.lifecycle 覆盖（避免「安装插件」在状态未知时误导） -->
      <span id="hint" class="hint">正在获取 dsh 状态…</span>
      <button id="btn-logs" class="link" type="button">查看日志</button>
    </footer>

    <!-- 设置面板（内嵌展开视图，分组：服务 / 界面） -->
    <div id="settings-panel" class="settings hidden">
      <div class="settings-title">设置</div>
      <div class="s-group">服务</div>
      <label class="field">
        <span class="field-label">端口（0 = 自动）</span>
        <input id="set-port" type="number" min="0" max="65535" step="1" value="3080">
      </label>
      <label class="field">
        <span class="field-label">Profile</span>
        <input id="set-profile" type="text" spellcheck="false" value="web">
      </label>
      <label class="field check">
        <span class="field-label">自动打开 Web UI</span>
        <input id="set-autoopen" type="checkbox">
      </label>
      <label class="field">
        <span class="field-label">徽标刷新间隔（秒）</span>
        <input id="set-badge" type="number" min="30" max="3600" step="1" value="30">
      </label>
      <div class="s-group">界面</div>
      <label class="field check">
        <span class="field-label">徽标提醒（回来看看）</span>
        <input id="set-attention" type="checkbox">
      </label>
      <label class="field check">
        <span class="field-label">徽标：工作完成提醒（绿!）</span>
        <input id="set-attention-done" type="checkbox">
      </label>
      <div class="field label-top">
        <span class="field-label">外观</span>
        <div id="theme-grid" class="theme-grid" role="radiogroup" aria-label="外观">
